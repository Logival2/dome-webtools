<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Webtools · versions</title>
<style>
  /* Accueil : la liste des versions, au centre, dans le style du panneau de l'outil
     (Replica Mono, capitales, blanc sur noir, filets pointillés, verre sombre) */
  @font-face {
    font-family: "Replica Mono";
    src: url("tools_spectre_000/fonts/Replica-Mono.otf") format("opentype");
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Replica Mono", monospace;
    font-size: 13px;
    line-height: 1.3;
    text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: min(420px, 100%);
    background: rgba(10, 10, 12, 0.32);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  h1 {
    margin: 0;
    padding: 10px;
    font-size: 13px;
    font-weight: 400;
  }
  ol { margin: 0; padding: 0; list-style: none; }
  li { border-top: 1px dashed rgba(255, 255, 255, 0.18); }
  a {
    display: grid;
    grid-template-columns: 3em 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px;
    color: inherit;
    text-decoration: none;
  }
  a:hover, a:focus-visible { background: rgba(255, 255, 255, 0.08); outline: none; }
  .date { opacity: 0.5; }
</style>
</head>
<body>
<main>
  <h1>Versions</h1>
  <ol>
    <li><a href="tools_spectre_000/"><span>V1</span><span>Spectral travel</span><span class="date">27.11.2026 →</span></a></li>
  </ol>
</main>
</body>
</html>
